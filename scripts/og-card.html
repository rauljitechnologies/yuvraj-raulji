<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  body {
    background:#050505; color:#f5f3ee;
    font-family:'Inter',system-ui,sans-serif;
    display:flex; align-items:center; gap:64px;
    padding:0 88px; overflow:hidden; position:relative;
  }
  /* The accent glow the site uses behind the hero, at card scale. */
  .glow { position:absolute; width:820px; height:820px; right:-260px; top:-300px;
    background:radial-gradient(circle, rgba(215,25,32,.30) 0%, rgba(215,25,32,0) 62%); }
  .rule { position:absolute; left:0; top:0; width:100%; height:6px; background:#d71920; }
  .left { flex:1; position:relative; z-index:2; }
  .eyebrow { font-family:'JetBrains Mono',monospace; font-weight:500;
    font-size:19px; letter-spacing:.28em; text-transform:uppercase;
    color:rgba(245,243,238,.55); margin-bottom:30px; }
  h1 { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:96px;
    line-height:.94; letter-spacing:-.03em; margin-bottom:26px; }
  .idea { font-size:27px; line-height:1.45; font-weight:400;
    color:rgba(245,243,238,.62); max-width:19ch; }
  .foot { position:absolute; left:88px; bottom:54px; z-index:2;
    font-family:'JetBrains Mono',monospace; font-size:17px; letter-spacing:.14em;
    text-transform:uppercase; color:rgba(245,243,238,.42); }
  .foot b { color:#d71920; font-weight:500; }
  figure { position:relative; z-index:2; width:340px; height:340px; flex:none;
    border-radius:50%; overflow:hidden;
    border:2px solid rgba(215,25,32,.55);
    box-shadow:0 0 90px rgba(215,25,32,.28); }
  figure img { width:100%; height:100%; object-fit:cover; display:block; }
</style></head>
<body>
  <div class="glow"></div><div class="rule"></div>
  <div class="left">
    <p class="eyebrow">AI &nbsp;|&nbsp; BUSINESS &nbsp;|&nbsp; ECOMMERCE</p>
    <h1>Yuvraj<br>Raulji</h1>
    <p class="idea">Technology that creates business leverage.</p>
  </div>
  <figure><img src="file:///Users/yuvrajsinhraulji/Documents/GitHub/yuvraj-raulji/public/assets/yuvraj-raulji.jpg" alt=""></figure>
  <p class="foot">yuvrajraulji.com &nbsp;<b>/</b>&nbsp; Vadodara, India</p>
